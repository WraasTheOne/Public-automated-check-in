version: '3.8'

services:
  userdb:
    image: mysql:8.0
    container_name: userdb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: userdb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    networks:
      internal_net:
        aliases:
          - userdb.check.internal

  sessiondb:
    image: redis:latest
    container_name: sessiondb
    ports:
      - "6379:6379"
    networks:
      internal_net:
        aliases:
          - sessiondb.check.internal

networks:
  internal_net:
    driver: bridge