services:
  userdb:
    image: mysql:8.0
    container_name: userdb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: userdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appuserpassword
    ports:
      - "3307:3306"  # Correct internal port for MySQL
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      internal_net:
        aliases:
          - userdb.check.internal

  sessiondb:
    image: redis:latest
    container_name: sessiondb
    ports:
      - "6379:6379"  # Host port 6379 -> Container port 6379
    networks:
      internal_net:
        aliases:
          - sessiondb.check.internal

  streamdb:
    image: redis:latest
    container_name: streamdb
    ports:
      - "6380:6379"  # Host port 6380 -> Container port 6379
    networks:
      internal_net:
        aliases:
          - streamdb.check.internal

  espverify:
    image: redis:latest
    container_name: espverify
    ports:
      - "6381:6379"  # Host port 6381 -> Container port 6379
    networks:
      internal_net:
        aliases:
          - espverify.check.internal

