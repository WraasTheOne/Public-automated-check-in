syntax = "proto3";

package login;
option go_package = "github.com/username/Public-automated-check-in/server/proto;proto";

service LoginService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string message = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  string userId = 1;
  string message = 2;
}